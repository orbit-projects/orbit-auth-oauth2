name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: orbit-auth-oauth2
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: orbit-auth-oauth2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/orbit-auth
          path: orbit-auth
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/orbit-core
          path: orbit-core
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and local Orbit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'setuptools>=83.0.0'
          python -m pip install -e ../orbit-auth -e ../orbit-core -e '.[dev]' build
      - name: Audit installed dependencies
        run: pip-audit --skip-editable --progress-spinner off
      - name: Run tests
        run: python -m pytest -q
      - name: Check lint and formatting
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
      - name: Check types
        run: python -m mypy
      - name: Build wheel and source distribution
        run: python -m build
